appId: com.krealomedia.krealoshift
name: 05 · El gerente corrige un fichaje y la auditoría conserva ambos valores
tags:
  - admin
  - auditoria
  - critico
  - incompleto
---
# Flujo E2E 5 de la especificación §28.
#
# ESTADO: INCOMPLETO A PROPÓSITO. La pantalla de hojas de tiempo todavía es un
# estado vacío: no existe la interfaz para corregir un fichaje ni para ver el
# historial de cambios. Este archivo cubre lo que hoy se puede recorrer —acceso
# administrativo y llegar a Horas— y deja anotado, sin inventar testID, lo que
# falta. Los testID necesarios están listados en e2e/README.md.
#
# Requisitos: usuarios demo creados con `scripts/seed-demo-users.mjs`, datos demo
# aplicados, y el dispositivo NO activado como kiosco (si lo está, el arranque
# manda al kiosco y nunca se ve el acceso administrativo).

- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "sign-in-email"
    timeout: 30000

# --- Acceso administrativo ---------------------------------------------------
# La contraseña se pasa por parámetro: no vive en el repositorio.
#   maestro test -e DEMO_PASSWORD="..." e2e/05-...yaml
- tapOn:
    id: "sign-in-email"
- inputText: "demo-manager@krealoshift.invalid"
- tapOn:
    id: "sign-in-password"
- inputText: "${DEMO_PASSWORD}"
- hideKeyboard
- tapOn:
    id: "sign-in-submit"

# El panel administrativo abre en Inicio, con sus cinco pestañas.
- extendedWaitUntil:
    visible: "Inicio"
    timeout: 30000
- assertVisible: "Horas"

# --- Hojas de tiempo ---------------------------------------------------------
- tapOn: "Horas"
- assertVisible: "Horas"

# ---------------------------------------------------------------------------
# PENDIENTE DE IMPLEMENTACIÓN. Cuando exista la interfaz de hojas de tiempo, la
# continuación de este flujo es:
#
#   1. elegir el periodo y la empleada Sofía Demo;
#   2. abrir el detalle diario y tocar "Corregir fichaje";
#   3. cambiar la hora y escribir un motivo (el motivo es obligatorio);
#   4. guardar;
#   5. comprobar que la fila muestra el valor nuevo Y que el historial de cambios
#      conserva el valor anterior, el autor y el motivo.
#
# Nada de eso se puede escribir todavía sin inventar testID. La regla del
# proyecto es no inventarlos: quedan pedidos en e2e/README.md.
#
# Lo que la corrección auditada SÍ tiene verificado hoy: las comprobaciones SQL
# de `supabase/tests/20_functions.sql`, que prueban que `time_events` es
# append-only y que una corrección crea una fila en `time_adjustments` con valor
# anterior, autor y motivo.
# ---------------------------------------------------------------------------
