# Verificación continua de Krealo Shift (especificación §4).
#
# Regla de diseño: NO requiere ningún secreto. Ni credenciales de Supabase, ni
# token de Expo, ni claves de Apple. Se puede ejecutar en un fork y en un
# repositorio recién clonado, y una persona nueva ve exactamente lo mismo que
# corriendo los comandos en su máquina.
#
# Por eso aquí no hay build de EAS ni pruebas contra la base: eso necesita
# credenciales y vive en las tareas locales documentadas en el README
# (`scripts/db-test.sh` y `eas build`).
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Un push nuevo cancela la corrida anterior de la misma rama: no tiene sentido
# gastar minutos verificando un commit que ya quedó atrás.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: Lint, typecheck y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Sin variables EXPO_PUBLIC_* a propósito: la app debe poder construirse y
      # probarse sin configuración, mostrando qué falta en vez de reventar (§30).
      - name: Lint
        run: npx eslint .

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Pruebas
        run: npx jest --ci

      # EMPAQUETAR DE VERDAD, y no solo comprobar tipos. `tsc` resuelve los tipos y
      # da verde aunque el grafo de modulos no se pueda construir: asi paso
      # inadvertido que el empaquetado para web fallaba entero porque Metro no
      # reconocia el `.wasm` de expo-sqlite. Un fallo que solo aparece al empaquetar
      # es el que llega al primer intento de subir a TestFlight.
      #
      # Se empaquetan las dos plataformas porque fallan por motivos distintos: web
      # por resolucion de assets, iOS por codigo que solo existe en nativo.
      - name: Empaquetar para web
        run: npx expo export --platform web --output-dir /tmp/export-web
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ejemplo.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: clave-de-ejemplo-solo-para-empaquetar

      - name: Empaquetar para iOS
        run: npx expo export --platform ios --output-dir /tmp/export-ios
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ejemplo.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: clave-de-ejemplo-solo-para-empaquetar

      # ABRIR LA APP DE VERDAD. Empaquetar prueba que el grafo de modulos se
      # construye; no prueba que la app arranque. Una pantalla en blanco por un
      # error en el arranque pasa las tres comprobaciones de arriba.
      #
      # Se reusa el export de web: `--clear` no hace falta aqui porque el runner
      # empieza sin cache.
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Comprobar que las pantallas renderizan
        run: node scripts/render-check.mjs /tmp/export-web

      - name: Auditar accesibilidad
        run: node scripts/a11y-check.mjs /tmp/export-web

      # Que los flujos de e2e/ apunten a testID que existen. No hay simulador de iOS
      # aqui, asi que los flujos no se ejecutan: sin esto, un id mal escrito no se
      # detecta nunca y e2e/ pasa a ser documentacion equivocada.
      - name: Comprobar los testID de los flujos
        run: node scripts/e2e-ids-check.mjs

  flujos-e2e:
    name: Sintaxis de los flujos de Maestro
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      # No se ejecutan los flujos —eso necesita un simulador de iOS y un build—
      # pero un YAML roto se detecta aquí y no cuando alguien intenta correrlos.
      # Los flujos son dos documentos YAML (cabecera + comandos), así que se leen
      # con `safe_load_all`; los subflujos son un solo documento.
      - name: Validar el YAML
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import yaml

          errores = []
          archivos = sorted(glob.glob('e2e/**/*.yaml', recursive=True))
          if not archivos:
              sys.exit('No se encontró ningún flujo en e2e/')

          for ruta in archivos:
              try:
                  documentos = list(yaml.safe_load_all(open(ruta, encoding='utf-8')))
              except yaml.YAMLError as error:
                  errores.append(f'{ruta}: {error}')
                  continue
              if not documentos:
                  errores.append(f'{ruta}: archivo vacío')
                  continue
              print(f'ok  {ruta}  ({len(documentos)} documento(s))')

          if errores:
              print('\nFallos:')
              for error in errores:
                  print(f'  {error}')
              sys.exit(1)
          PY
