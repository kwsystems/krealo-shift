# Verificación continua de Krealo Shift (especificación §4).
#
# Regla de diseño: NO requiere ningún secreto. Ni credenciales de Firebase, ni
# token de Expo, ni claves de Apple. Se puede ejecutar en un fork y en un
# repositorio recién clonado, y una persona nueva ve exactamente lo mismo que
# corriendo los comandos en su máquina.
#
# Por eso aquí no hay build de EAS ni pruebas contra la base: eso necesita
# credenciales y vive en las tareas locales documentadas en el README
# (`scripts/db-test.sh` y `eas build`).
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Un push nuevo cancela la corrida anterior de la misma rama: no tiene sentido
# gastar minutos verificando un commit que ya quedó atrás.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: Lint, typecheck y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # LAS DE `functions/` VAN AQUÍ, y estaban al final del todo. El lint de la raíz
      # alcanza `functions/src`, así que `import/no-unresolved` intenta resolver
      # `firebase-admin` y `firebase-functions` antes de que exista su `node_modules`:
      # 23 errores y el CI en rojo. En local no se ve, porque quien toca las funciones
      # ya las tiene instaladas.
      - name: Instalar dependencias de las Cloud Functions
        run: npm ci --prefix functions

      # Sin variables EXPO_PUBLIC_* a propósito: la app debe poder construirse y
      # probarse sin configuración, mostrando qué falta en vez de reventar (§30).
      - name: Lint
        run: npx eslint .

      # El formato tambien es una puerta. Antes NO lo era, y 57 archivos del proyecto
      # estaban sin formatear: eso hace que `npm run format` —que el README documenta—
      # produzca un diff enorme de ruido a quien lo ejecute por primera vez.
      # `.prettierignore` deja fuera lo que no es codigo del proyecto: los 219 skills,
      # las referencias de diseno, el instalador generado y los flujos de Maestro.
      - name: Formato
        run: npx prettier --check .

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Pruebas
        run: npx jest --ci

      # EMPAQUETAR DE VERDAD, y no solo comprobar tipos. `tsc` resuelve los tipos y
      # da verde aunque el grafo de modulos no se pueda construir: asi paso
      # inadvertido que el empaquetado para web fallaba entero porque Metro no
      # reconocia el `.wasm` de expo-sqlite. Un fallo que solo aparece al empaquetar
      # es el que llega al primer intento de subir a TestFlight.
      #
      # Se empaquetan las dos plataformas porque fallan por motivos distintos: web
      # por resolucion de assets, iOS por codigo que solo existe en nativo.
      - name: Empaquetar para web
        run: npx expo export --platform web --output-dir /tmp/export-web
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: clave-de-ejemplo-solo-para-empaquetar
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ejemplo.firebaseapp.com
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ejemplo
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ejemplo.firebasestorage.app
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          EXPO_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:ejemplo'

      - name: Empaquetar para iOS
        run: npx expo export --platform ios --output-dir /tmp/export-ios
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: clave-de-ejemplo-solo-para-empaquetar
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ejemplo.firebaseapp.com
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ejemplo
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ejemplo.firebasestorage.app
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          EXPO_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:ejemplo'

      # ABRIR LA APP DE VERDAD. Empaquetar prueba que el grafo de modulos se
      # construye; no prueba que la app arranque. Una pantalla en blanco por un
      # error en el arranque pasa las tres comprobaciones de arriba.
      #
      # Se reusa el export de web: `--clear` no hace falta aqui porque el runner
      # empieza sin cache.
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Comprobar que las pantallas renderizan
        run: node scripts/render-check.mjs /tmp/export-web

      - name: Auditar accesibilidad
        run: node scripts/a11y-check.mjs /tmp/export-web

      # Y USARLA, no solo comprobar que se pinta. Una pantalla se renderiza perfecta
      # aunque no responda a nada: el peor fallo de este proyecto fue un teclado de
      # PIN que se quedaba en "comprobando" para siempre, y el chequeo de render lo
      # daba por bueno. Este teclea un PIN de verdad, cambia de idioma y toca botones.
      - name: Comprobar que la app responde a la interaccion
        run: node scripts/interaccion-check.mjs /tmp/export-web

      # Los iconos los genera scripts/generar-iconos.mjs a partir de una definicion
      # geometrica y de los tokens de color de la app. Va en este trabajo porque
      # necesita el Chromium que ya se instalo arriba. Sin este chequeo, cambiar un
      # token de marca deja los PNG con el color viejo y nadie lo nota: un icono
      # equivocado no rompe ninguna prueba, solo se ve raro en un iPad.
      - name: Comprobar que los iconos estan al dia
        run: node scripts/generar-iconos.mjs --verificar

      # Que los flujos de e2e/ apunten a testID que existen. No hay simulador de iOS
      # aqui, asi que los flujos no se ejecutan: sin esto, un id mal escrito no se
      # detecta nunca y e2e/ pasa a ser documentacion equivocada.
      - name: Comprobar los testID de los flujos
        run: node scripts/e2e-ids-check.mjs

      # Lo declarado que nadie usa, y los controles que no hacen nada. Las dos cosas se
      # encontraron a mano despues de meses, y tres de las claves huerfanas no eran
      # texto sobrante: eran funciones que §31 y §8 pedian y que nunca se conectaron.
      - name: Comprobar coherencia (i18n huerfana, controles muertos)
        run: node scripts/coherencia-check.mjs

      # Las Cloud Functions compilan aparte: tienen su propio tsconfig y corren en
      # Node, no en React Native. Sin este paso, un error de tipos del servidor solo
      # aparece al desplegar, que es el peor momento para enterarse.
      - name: Compilar las Cloud Functions
        run: npx tsc -p functions --noEmit

      # VA DESPUES DE COMPILAR A PROPOSITO: esto no mira tipos, mira NOMBRES. El
      # cliente y las funciones se hablan por un objeto sin tipo comun, asi que una
      # clave mal puesta compila, pasa el linter, pasa las pruebas —la demostracion
      # implementa su propia version con la forma correcta— y falla en produccion.
      # Asi se fueron a produccion, entre otros, un `activateKiosk` que respondia 400
      # siempre y un `submitTimeEvent` que guardaba el fichaje y decia que habia
      # fallado. Ninguno de los pasos anteriores puede verlos.
      - name: Comprobar contratos cliente ↔ Cloud Functions
        run: node scripts/contratos-check.mjs

  arneses:
    name: 'Arnés: ${{ matrix.arnes.nombre }}'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # LOS SIETE ARNESES DE LA DEMOSTRACIÓN. `responsive` ya estaba; los otros SEIS
    # entran aquí, y hasta ahora solo corrían cuando alguien se acordaba.
    #
    # POR QUÉ ESTABAN FUERA Y POR QUÉ ENTRAN AHORA. `verificar` recorre la app SIN modo
    # demostración: comprueba que las pantallas se pintan, que responden y que son
    # accesibles, pero sobre datos vacíos. Estos la recorren COMO LA VIVE UNA PERSONA,
    # con la tienda sembrada, y encuentran cosas que el otro no puede ver.
    #
    # La consecuencia ya pasó dos veces:
    #  - e3d5a2a dejó el reloj web SIN PODER FICHAR —la foto de verificación fallaba
    #    siempre— y su CI estuvo EN VERDE. Lo destapó `kiosco:check` corrido a mano un
    #    día después.
    #  - el panel llevaba meses con dieciocho fallos de ancho —un horario que mostraba
    #    «03:00 – 09:…», una barra de pestañas que decía «Hora…» al lado de «Horas»— y
    #    ninguna revisión los vio.
    # Un arnés que solo corre cuando alguien se acuerda no protege nada.
    #
    # LO QUE LOS TENÍA FUERA eran las esperas: cada uno esperaba un número fijo de
    # milisegundos afinado en una máquina concreta, y en un runner compartido más lento
    # se quedan cortas y el arnés mide una pantalla a medio montar. Eso da rojo, y el
    # rojo no es de la app: es del reloj. Ahora esperan POR LA PANTALLA —hasta ver su
    # marcador— con el número solo como techo, así que una máquina lenta tarda más en
    # vez de fallar. Ver `esperarPantalla` en scripts/lib/arnes-web.mjs.
    #
    # UNO POR RUNNER Y NO SIETE PASOS EN UNO, por el reloj: en serie son unos quince
    # minutos y así son unos seis, porque el empaquetado (~1,5 min) es lo único que se
    # repite. `fail-fast: false` porque cuando se rompe algo de verdad se rompe en
    # varios a la vez, y verlos todos dice qué pasó mucho mejor que ver el primero.
    strategy:
      fail-fast: false
      matrix:
        arnes:
          - { id: demo, nombre: 'ocho pantallas con contenido y distintas entre sí' }
          - { id: kiosco, nombre: 'el reloj de fichaje, de punta a punta con foto' }
          - { id: reportes, nombre: 'Reportes cuadra con Horas' }
          # `capturas` es el tercer argumento de inicio-check.mjs: las deja DENTRO del
          # workspace para poder subirlas como artefacto sin depender de rutas absolutas.
          - { id: inicio, nombre: 'Inicio cambia según el día', extra: capturas }
          - { id: tema, nombre: 'claro y oscuro sin mezclarse' }
          - { id: contraste, nombre: 'todo el texto se lee' }
          - { id: responsive, nombre: 'nada se sale ni se recorta' }

    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      # Con `EXPO_PUBLIC_DEMO=1`: los arneses entran con el botón de demostración y
      # recorren el panel con datos. Sin demo se quedarían midiendo el acceso una y otra
      # vez, que es justo el engaño contra el que tienen guardas.
      - name: Empaquetar la demostración
        run: npm run demo:export

      - name: Correr el arnés
        run: npm run ${{ matrix.arnes.id }}:check -- ${{ matrix.arnes.extra }}

      # Las tres capturas de Inicio son lo que se mira para decidir si, además de
      # distinto, está bien. En una máquina se abren solas; aquí hay que subirlas.
      # `always()` porque cuando el arnés falla es cuando más se quieren ver.
      - name: Guardar las capturas de Inicio
        if: ${{ always() && matrix.arnes.id == 'inicio' }}
        uses: actions/upload-artifact@v4
        with:
          name: capturas-inicio
          path: capturas
          if-no-files-found: warn

  flujos-e2e:
    name: Sintaxis de los flujos de Maestro
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      # No se ejecutan los flujos —eso necesita un simulador de iOS y un build—
      # pero un YAML roto se detecta aquí y no cuando alguien intenta correrlos.
      # Los flujos son dos documentos YAML (cabecera + comandos), así que se leen
      # con `safe_load_all`; los subflujos son un solo documento.
      - name: Validar el YAML
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import yaml

          errores = []
          archivos = sorted(glob.glob('e2e/**/*.yaml', recursive=True))
          if not archivos:
              sys.exit('No se encontró ningún flujo en e2e/')

          for ruta in archivos:
              try:
                  documentos = list(yaml.safe_load_all(open(ruta, encoding='utf-8')))
              except yaml.YAMLError as error:
                  errores.append(f'{ruta}: {error}')
                  continue
              if not documentos:
                  errores.append(f'{ruta}: archivo vacío')
                  continue
              print(f'ok  {ruta}  ({len(documentos)} documento(s))')

          if errores:
              print('\nFallos:')
              for error in errores:
                  print(f'  {error}')
              sys.exit(1)
          PY
